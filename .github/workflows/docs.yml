# Builds the documentation site in website/ and deploys it to GitHub Pages:
# https://endless728.github.io/react-native-expo-boilerplate/
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      # The app's root tsconfig.json extends expo/tsconfig.base. The docs build
      # doesn't install the app, but Vite still reads that tsconfig, so give it
      # an empty base to extend.
      - name: Stub expo/tsconfig.base for the docs build
        working-directory: .
        run: |
          mkdir -p node_modules/expo
          echo '{"compilerOptions":{}}' > node_modules/expo/tsconfig.base.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
